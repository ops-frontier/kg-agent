services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-kgpassword}
    volumes:
      - ./neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  kg-collector:
    build: .
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      GH_PAT: ${GH_PAT}
      GH_TARGET_ORGANIZATION: ${GH_TARGET_ORGANIZATION}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kgpassword}
      NEO4J_TRANSACTION_RETRY_SECONDS: 120

  kg-agent:
    build: ./kg_agent
    restart: unless-stopped
    depends_on:
      kg-collector:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      COLLECTOR_URL: http://kg-collector:8081
      NEO4J_URL: http://neo4j:7474
      NEO4J_BOLT_HOST: neo4j
      NEO4J_BOLT_PORT: 7687