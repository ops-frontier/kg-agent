[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-graph-collector"
version = "0.1.0"
description = "Collect GitHub metadata, source structure, and dependencies into Neo4j"
requires-python = ">=3.11"
dependencies = [
  "neo4j>=5.26,<6",
  "tree-sitter>=0.25.2,<0.26",
  "tree-sitter-language-pack>=0.9.0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
kg-collect = "kg_collector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
