services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-kgpassword}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  kg-collector:
    build: .
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      PORT: 8081
      GH_PAT: ${GH_PAT}
      GH_TARGET_ORGANIZATION: ${GH_TARGET_ORGANIZATION}
      TARGET_REPOSITORY_GLOB: ${TARGET_REPOSITORY_GLOB:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kgpassword}
      NEO4J_TRANSACTION_RETRY_SECONDS: 120

  kg-agent:
    build: ./kg_agent
    restart: unless-stopped
    depends_on:
      kg-collector:
        condition: service_started
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      PORT: 8080
      COLLECTOR_URL: http://kg-collector:8081
      NEO4J_URL: http://neo4j:7474
      NEO4J_BOLT_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kgpassword}
      GH_PAT: ${GH_PAT}
      GCP_SA_KEY_JSON: ${GCP_SA_KEY_JSON}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      GCP_MODEL: ${GCP_MODEL:-gemini-2.5-flash}
      GRAPHRAG_MAX_ITERATIONS: ${GRAPHRAG_MAX_ITERATIONS:-10}
      GRAPHRAG_MAX_RESULTS: ${GRAPHRAG_MAX_RESULTS:-300}
      GRAPHRAG_MAX_GITHUB_FILES: ${GRAPHRAG_MAX_GITHUB_FILES:-20}
      GRAPHRAG_MAX_GITHUB_FILE_BYTES: ${GRAPHRAG_MAX_GITHUB_FILE_BYTES:-200000}
      GRAPHRAG_MAX_OUTPUT_TOKENS: ${GRAPHRAG_MAX_OUTPUT_TOKENS:-8192}
      GRAPHRAG_MAX_OUTPUT_CHUNKS: ${GRAPHRAG_MAX_OUTPUT_CHUNKS:-3}

volumes:
  neo4j-data: